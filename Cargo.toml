[package]
name = "prisma_engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]

# O projeto virou um "workspace": uma pasta com mais de um pacote.
# A raiz continua sendo o motor (`prisma_engine`); `game/` é o jogo com tela (`prisma_game`).
[workspace]
members = ["game"]
# `tools/` é um pacote à parte (tem o próprio [workspace] e Cargo.lock): o gerador de APK
# carrega um Cargo antigo e não pode enxergar as dependências das ferramentas.
exclude = ["tools"]

# O Macroquad descompacta cada música (OGG) inteira ao carregar, e o CI gera o APK em modo de
# desenvolvimento (debug). Sem otimizar as bibliotecas, carregar uma música travava o jogo por uns
# 5 s. Com `opt-level = 2` só nas dependências (o código do jogo continua em modo de
# desenvolvimento, fácil de depurar) isso cai muito. O teste `tests/workspace.rs` confere a seção.
[profile.dev.package."*"]
opt-level = 2
