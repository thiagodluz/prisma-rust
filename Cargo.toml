[package]
name = "prisma_engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]

# O projeto virou um "workspace": uma pasta com mais de um pacote.
# A raiz continua sendo o motor (`prisma_engine`); `game/` é o jogo com tela (`prisma_game`).
[workspace]
members = ["game"]
# `tools/` é um pacote à parte (tem o próprio [workspace] e Cargo.lock): o gerador de APK
# carrega um Cargo antigo e não pode enxergar as dependências das ferramentas.
exclude = ["tools"]
