[package]
name = "prisma_game"
version = "0.1.0"
# Edition 2021 de propósito: a ferramenta que gera o APK (cargo-quad-apk) não lê a 2024.
# O teste `tests/workspace.rs` avisa se alguém mudar isso.
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
# O motor do jogo (as regras), que fica na pasta de cima.
prisma_engine = { path = ".." }
# Biblioteca que abre a janela, desenha, lê toque e (mais tarde) toca som.
macroquad = "0.4"

# Dados para o gerador de APK. Só o essencial por enquanto.
[package.metadata.android]
# O último pedaço do package_name TEM de ser o nome do programa (`name` lá em cima): é por ele
# que o Android acha a biblioteca (libprisma_game.so). Se mudar um, mude o outro; o teste
# `tests/workspace.rs` avisa. (O Prisma em JS usa com.thiagodluz.prisma, então os dois convivem.)
package_name = "com.thiagodluz.prisma_game"
label = "Prisma (Rust)"
# Ícones do app (gerados por tools/prepare_assets.py em android_res/mipmap-*/).
res = "android_res"
icon = "@mipmap/ic_launcher"

[package.metadata.android.activity_attributes]
# Androids novos exigem declarar isto; sem ele o app não instala.
"android:exported" = "true"
# Sempre em pé (retrato).
"android:screenOrientation" = "portrait"
