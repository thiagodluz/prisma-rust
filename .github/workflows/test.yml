name: Testes

# Roda os testes a cada envio e a cada pedido de mesclagem.
on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # O áudio do jogo usa a biblioteca ALSA do Linux na hora de juntar o programa.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev
      # Testa o motor e o jogo (a raiz sozinha só testaria o motor).
      - run: cargo test --workspace
      # As ferramentas (teste do celular virtual e gerador de imagens) são outro pacote, fora do workspace.
      - run: cargo test --manifest-path tools/Cargo.toml
