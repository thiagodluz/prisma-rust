name: Android

# Gera o APK a cada envio para a main, ou quando alguém clicar em "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Se chegar um envio novo enquanto o anterior ainda está gerando o APK, o antigo é cancelado.
concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    # Escrever na release exige permissão de escrita no repositório (só neste fluxo).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # A ferramenta que gera o APK carrega um Cargo antigo por dentro, que pode não ler o
      # formato novo do Cargo.lock (versão 4). Só neste fluxo, sem commitar, voltamos o
      # arquivo para a versão 3, que é igual para pacotes do crates.io.
      - name: Deixar o Cargo.lock no formato antigo
        run: sed -i 's/^version = 4$/version = 3/' Cargo.lock

      # Imagem oficial do tutorial do Macroquad: já traz Android SDK/NDK e o cargo-quad-apk.
      # Modo debug (assinado com uma chave de teste).
      # O comando roda de dentro de `game/` (-w): a ferramenta ignora `-p` e só enxerga o
      # pacote da pasta onde está; da raiz ela pegaria o motor e reclamaria que não acha o
      # miniquad. O APK sai em target/android-artifacts/debug/apk/ na raiz do projeto.
      # A imagem traz um Rust antigo (1.79, de 2024); o motor usa `Option::is_none_or`, que só
      # existe a partir do 1.82. Por isso o contêiner atualiza o Rust antes e instala de novo
      # os alvos do Android para a versão nova.
      - name: Gerar o APK
        run: |
          docker run --rm -v "$PWD":/root/src -w /root/src/game notfl3/cargo-apk sh -c '
            rustup update stable &&
            rustup default stable &&
            rustup target add armv7-linux-androideabi aarch64-linux-android i686-linux-android &&
            rustc --version &&
            cargo quad-apk build'

      # Só informação (não reprova o fluxo): lista o que tem dentro do APK e quais funções cada
      # biblioteca de cada processador expõe para o Android (JNI_OnLoad, Java_...).
      - name: Conferir o que tem dentro do APK
        run: |
          APK="$(ls target/android-artifacts/debug/apk/*.apk | head -n 1)"
          unzip -l "$APK"
          mkdir -p /tmp/apk-aberto && unzip -q -o "$APK" -d /tmp/apk-aberto
          for abi in armeabi-v7a arm64-v8a x86; do
            LIB="/tmp/apk-aberto/lib/$abi/libprisma_game.so"
            echo "===== $abi ====="
            ls -l "$LIB"
            readelf -d "$LIB" | grep -E "NEEDED|SONAME" || true
            readelf --dyn-syms -W "$LIB" | grep -E "JNI_OnLoad|Java_|ANativeActivity|android_main| main$" | head -20 || true
          done

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: prisma-debug-apk
          path: target/android-artifacts/debug/apk/*.apk
          if-no-files-found: error

      # Release de endereço fixo, para baixar o .apk direto no celular, sem zip e sem login:
      # https://github.com/thiagodluz/prisma-rust/releases/download/apk-mais-recente/prisma-rust.apk
      # A cada execução a release antiga é apagada e uma nova é criada com o APK mais recente.
      # Só roda na branch main: um teste numa branch de trabalho não pode trocar o APK que o
      # celular baixa pelo link fixo.
      - name: Publicar na release "apk-mais-recente"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(ls target/android-artifacts/debug/apk/*.apk | head -n 1)" prisma-rust.apk
          gh release delete apk-mais-recente --cleanup-tag --yes || true
          gh release create apk-mais-recente prisma-rust.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "APK mais recente (versão de teste)" \
            --notes "Gerado automaticamente a partir do commit ${GITHUB_SHA::7}. É uma versão de teste, assinada com uma chave de debug que muda a cada geração: desinstale a versão anterior antes de instalar esta."

  # Abre o APK num celular virtual e joga (Zen e Clássico, com toque e arrasto), conferindo
  # as jogadas pelo registro do app; guarda o registro de erros e as fotos da tela. Roda depois
  # da release, então um defeito no app não impede de baixar o APK, só deixa este teste
  # vermelho. Duas versões do Android, para comparar.
  emulador:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 30, arch: x86 }
          - { api: 34, arch: x86_64 }
    steps:
      - uses: actions/checkout@v4

      - name: Baixar o APK gerado
        uses: actions/download-artifact@v4
        with:
          name: prisma-debug-apk
          path: apk

      # O emulador precisa de acesso ao KVM (aceleração do processador).
      - name: Liberar o KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Para reduzir a foto da tela antes de imprimi-la no registro (tools/teste-emulador.sh).
      - name: Instalar o ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Jogar no celular virtual
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: google_apis
          disable-animations: true
          script: bash tools/teste-emulador.sh apk resultado

      - name: Guardar o registro e a foto da tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulador-android-${{ matrix.api }}
          path: resultado
          if-no-files-found: ignore
