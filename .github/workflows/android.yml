name: Android

# Gera o APK a cada envio para a main, ou quando alguém clicar em "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Se chegar um envio novo enquanto o anterior ainda está gerando o APK, o antigo é cancelado.
concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    # Escrever na release exige permissão de escrita no repositório (só neste fluxo).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # A ferramenta que gera o APK carrega um Cargo antigo por dentro, que pode não ler o
      # formato novo do Cargo.lock (versão 4). Só neste fluxo, sem commitar, voltamos o
      # arquivo para a versão 3, que é igual para pacotes do crates.io.
      - name: Deixar o Cargo.lock no formato antigo
        run: sed -i 's/^version = 4$/version = 3/' Cargo.lock

      # As músicas e os ambientes do Zen não ficam no git: `prisma_tools audio` baixa a release v1.4.2
      # do Prisma em JS (onde os 9 áudios vêm embutidos), confere o SHA-256 de cada um e prepara os
      # ambientes (laços de 60 s a 44,1 kHz, com o `ffmpeg`). A pasta `game/sons` resultante vai para
      # dentro do APK (`assets = "sons"` em game/Cargo.toml). Só a parte de áudio da ferramenta é
      # compilada (`--no-default-features --features audio`), sem o gerador de imagens.
      - name: Preparar os sons
        run: |
          set -eu
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
          cargo run --release --manifest-path tools/Cargo.toml --no-default-features --features audio -- audio game/sons
          echo "== o que ficou em game/sons =="
          ls -laR game/sons

      # Imagem oficial do tutorial do Macroquad: já traz Android SDK/NDK e o cargo-quad-apk.
      # Modo debug, mas SEM assinar (`--nosign`): quem assina é o passo seguinte, com a chave fixa
      # do app (por isso o app instala por cima do anterior e mantém a partida salva).
      # O `versionCode` do app é o número da execução (sobe a cada execução; escrito só aqui no
      # executor, sem commitar), para o Android aceitar uma atualização por cima da outra.
      # O comando roda de dentro de `game/` (-w): a ferramenta ignora `-p` e só enxerga o
      # pacote da pasta onde está; da raiz ela pegaria o motor e reclamaria que não acha o
      # miniquad. O APK sai em target/android-artifacts/debug/apk/ na raiz do projeto.
      # A imagem traz um Rust antigo (1.79, de 2024); o motor usa `Option::is_none_or`, que só
      # existe a partir do 1.82. Por isso o contêiner atualiza o Rust antes e instala de novo
      # os alvos do Android para a versão nova.
      - name: Gerar o APK (sem assinar)
        run: |
          sed -i "s/^version_code = .*/version_code = ${GITHUB_RUN_NUMBER}/" game/Cargo.toml
          grep -n "^version_code = ${GITHUB_RUN_NUMBER}$" game/Cargo.toml
          docker run --rm -v "$PWD":/root/src -w /root/src/game notfl3/cargo-apk sh -c '
            rustup update stable &&
            rustup default stable &&
            rustup target add armv7-linux-androideabi aarch64-linux-android i686-linux-android &&
            rustc --version &&
            cargo quad-apk build --nosign'
          echo "== o que saiu em target/android-artifacts/debug/apk/ =="
          ls -la target/android-artifacts/debug/apk/

      # Assina com a chave fixa do app, guardada nos segredos do repositório
      # (PRISMA_RUST_KEYSTORE_BASE64 e PRISMA_RUST_KEYSTORE_PASSWORD; ver "Assinatura" em
      # docs/notes/android-build.md). O arquivo da chave só existe numa pasta temporária do
      # executor e é apagado no passo seguinte. Depois de assinar, confere se a impressão digital
      # do certificado é a de tools/assinatura-sha256.txt: se for outra, o APK não seguiria
      # instalando por cima do anterior, então o fluxo reprova em vez de publicar.
      - name: Assinar o APK com a chave fixa
        env:
          KEYSTORE_BASE64: ${{ secrets.PRISMA_RUST_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PRISMA_RUST_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Faltam os segredos PRISMA_RUST_KEYSTORE_BASE64 e/ou PRISMA_RUST_KEYSTORE_PASSWORD do repositório. Veja a seção 'Assinatura' de docs/notes/android-build.md."
            exit 1
          fi

          # O APK sem assinatura: o único .apk da pasta (se houver mais de um, não adivinho).
          ls -la target/android-artifacts/debug/apk/
          SEM_ASSINAR=""
          CONTAGEM=0
          for arquivo in target/android-artifacts/debug/apk/*.apk; do
            [ -e "$arquivo" ] || continue
            case "$arquivo" in *unaligned*) continue ;; esac
            SEM_ASSINAR="$arquivo"
            CONTAGEM=$((CONTAGEM + 1))
          done
          if [ "$CONTAGEM" -ne 1 ]; then
            echo "::error::Esperava achar um único .apk (fora os 'unaligned') em target/android-artifacts/debug/apk/ e achei $CONTAGEM."
            exit 1
          fi
          echo "APK sem assinatura: $SEM_ASSINAR"

          # As ferramentas do Android SDK (a versão mais nova das que o executor traz).
          FERRAMENTAS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          FERRAMENTAS="${FERRAMENTAS%/}"
          echo "Ferramentas do Android: $FERRAMENTAS"

          CHAVE="$RUNNER_TEMP/prisma-rust.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$CHAVE"
          ALINHADO="$RUNNER_TEMP/prisma-rust-alinhado.apk"
          mkdir -p apk-assinado
          FINAL="apk-assinado/prisma-rust.apk"

          "$FERRAMENTAS/zipalign" -p -f 4 "$SEM_ASSINAR" "$ALINHADO"
          "$FERRAMENTAS/apksigner" sign \
            --ks "$CHAVE" --ks-key-alias prisma \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "$FINAL" "$ALINHADO"
          rm -f "$ALINHADO"

          SAIDA="$("$FERRAMENTAS/apksigner" verify --print-certs -v "$FINAL")"
          echo "$SAIDA"
          # O apksigner novo escreve "V3.0 Signer: certificate SHA-256 digest: ..." e o antigo "Signer #1 certificate ...".
          LINHA="$(grep -m 1 -E 'Signer.*certificate SHA-256 digest:' <<< "$SAIDA" || true)"
          OBTIDO="$(sed 's/.*digest: *//' <<< "$LINHA" | tr -d ' \r' | tr 'A-F' 'a-f')"
          ESPERADO="$(tr -d ' \r\n' < tools/assinatura-sha256.txt | tr 'A-F' 'a-f')"
          echo "Impressão digital esperada: $ESPERADO"
          echo "Impressão digital obtida:   $OBTIDO"
          if [ -z "$OBTIDO" ] || [ "$OBTIDO" != "$ESPERADO" ]; then
            echo "::error::A impressão digital do APK assinado não é a de tools/assinatura-sha256.txt. Os segredos têm a chave certa?"
            exit 1
          fi
          ls -l "$FINAL"

      # Apaga o arquivo da chave do executor, mesmo se um passo anterior tiver falhado.
      - name: Apagar o arquivo da chave
        if: always()
        run: rm -f "$RUNNER_TEMP/prisma-rust.keystore" "$RUNNER_TEMP/prisma-rust-alinhado.apk"

      # Só informação (não reprova o fluxo): lista o que tem dentro do APK e quais funções cada
      # biblioteca de cada processador expõe para o Android (JNI_OnLoad, Java_...).
      - name: Conferir o que tem dentro do APK
        run: |
          APK="apk-assinado/prisma-rust.apk"
          FERRAMENTAS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          "${FERRAMENTAS%/}/aapt2" dump badging "$APK" | head -n 5 || true
          unzip -l "$APK"
          mkdir -p /tmp/apk-aberto && unzip -q -o "$APK" -d /tmp/apk-aberto
          for abi in armeabi-v7a arm64-v8a x86; do
            LIB="/tmp/apk-aberto/lib/$abi/libprisma_game.so"
            echo "===== $abi ====="
            ls -l "$LIB"
            readelf -d "$LIB" | grep -E "NEEDED|SONAME" || true
            readelf --dyn-syms -W "$LIB" | grep -E "JNI_OnLoad|Java_|ANativeActivity|android_main| main$" | head -20 || true
          done

      # Reprova o fluxo se o APK não pedir o Android mínimo 26 e o alvo 34 (game/Cargo.toml) ou se
      # o ícone do app não for o adaptativo (res/mipmap-anydpi-v26/ic_launcher.xml, gerado por
      # `prisma_tools imagens`). Lê o `aapt2 dump badging` inteiro: minSdkVersion (o aapt2 novo escreve
      # `sdkVersion:'26'` quando só há mínimo), targetSdkVersion e os application-icon-*.
      - name: Conferir versões e ícone do APK
        run: |
          set -eu
          APK="apk-assinado/prisma-rust.apk"
          FERRAMENTAS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          BADGING="$("${FERRAMENTAS%/}/aapt2" dump badging "$APK")"
          MINIMO="$(grep -m 1 -E "^(minSdkVersion|sdkVersion):'" <<< "$BADGING" | sed -E "s/.*:'([0-9]+)'.*/\1/" || true)"
          ALVO="$(grep -m 1 -E "^targetSdkVersion:'" <<< "$BADGING" | sed -E "s/.*:'([0-9]+)'.*/\1/" || true)"
          ICONES="$(grep -E "^application-icon-" <<< "$BADGING" || true)"
          echo "minSdkVersion:    ${MINIMO:-?} (esperado 26)"
          echo "targetSdkVersion: ${ALVO:-?} (esperado 34)"
          echo "Ícones do app:"
          echo "$ICONES"
          ERRO=0
          if [ "$MINIMO" != '26' ]; then
            echo "::error::O APK pede minSdkVersion ${MINIMO:-?}, e o esperado é 26 (min_sdk_version em game/Cargo.toml)."
            ERRO=1
          fi
          if [ "$ALVO" != '34' ]; then
            echo "::error::O APK tem targetSdkVersion ${ALVO:-?}, e o esperado é 34 (target_sdk_version em game/Cargo.toml)."
            ERRO=1
          fi
          if ! grep -q 'mipmap-anydpi-v26/ic_launcher.xml' <<< "$ICONES"; then
            echo "::error::O ícone do APK não aponta para mipmap-anydpi-v26/ic_launcher.xml (o ícone adaptativo)."
            ERRO=1
          fi
          exit "$ERRO"

      # Reprova o fluxo se o APK não tiver os 9 áudios (sem eles o Zen não teria música nem
      # ambiente) ou se passar de 60 MB (a spec pede um APK de tamanho razoável).
      - name: Conferir os sons e o tamanho do APK
        run: |
          set -eu
          APK="apk-assinado/prisma-rust.apk"
          LISTA="$(unzip -Z1 "$APK")"
          FALTAM=""
          for arquivo in musica/magic-puzzle musica/cozy-puzzle musica/space-city \
                         ambiente/stream ambiente/rain-soft ambiente/forest-cicadas \
                         ambiente/rainforest ambiente/rain-thunder ambiente/soft-noise; do
            if ! grep -qx "assets/$arquivo.ogg" <<< "$LISTA"; then
              FALTAM="$FALTAM assets/$arquivo.ogg"
            fi
          done
          if [ -n "$FALTAM" ]; then
            echo "::error::O APK não tem estes sons:$FALTAM. Confira o passo 'Preparar os sons' e o 'assets = \"sons\"' de game/Cargo.toml."
            exit 1
          fi
          TAMANHO="$(stat -c %s "$APK")"
          LIMITE=$((60 * 1024 * 1024))
          echo "Tamanho do APK: $TAMANHO bytes (cerca de $((TAMANHO / 1024 / 1024)) MB); o limite é 60 MB."
          if [ "$TAMANHO" -gt "$LIMITE" ]; then
            echo "::error::O APK ficou com $((TAMANHO / 1024 / 1024)) MB, acima do limite de 60 MB."
            exit 1
          fi

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: prisma-debug-apk
          path: apk-assinado/*.apk
          if-no-files-found: error

      # Release de endereço fixo, para baixar o .apk direto no celular, sem zip e sem login:
      # https://github.com/thiagodluz/prisma-rust/releases/download/apk-mais-recente/prisma-rust.apk
      # A cada execução a release antiga é apagada e uma nova é criada com o APK mais recente.
      # Só roda na branch main: um teste numa branch de trabalho não pode trocar o APK que o
      # celular baixa pelo link fixo.
      - name: Publicar na release "apk-mais-recente"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apk-assinado/prisma-rust.apk prisma-rust.apk
          gh release delete apk-mais-recente --cleanup-tag --yes || true
          gh release create apk-mais-recente prisma-rust.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "APK mais recente (versão de teste)" \
            --notes "Gerado automaticamente a partir do commit ${GITHUB_SHA::7}. É uma versão de teste, assinada com a chave fixa do app: instala por cima da anterior e mantém a partida salva. Se você ainda tem uma versão assinada com a chave antiga (de teste, que mudava a cada geração), desinstale-a uma vez antes de instalar esta."

  # Abre o APK num celular virtual e joga (Zen e Clássico, com toque e arrasto), conferindo
  # as jogadas pelo registro do app; guarda o registro de erros e as fotos da tela. Roda depois
  # da release, então um defeito no app não impede de baixar o APK, só deixa este teste
  # vermelho. Duas versões do Android, para comparar.
  emulador:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 30, arch: x86 }
          - { api: 34, arch: x86_64 }
    steps:
      - uses: actions/checkout@v4

      # O teste do celular virtual é um programa em Rust (pasta tools/, fora do workspace do jogo).
      # Compila só a parte do emulador (--no-default-features), que não tem nenhuma dependência.
      - uses: dtolnay/rust-toolchain@stable
      - name: Compilar o teste do celular virtual
        run: cargo build --release --manifest-path tools/Cargo.toml --no-default-features

      - name: Baixar o APK gerado
        uses: actions/download-artifact@v4
        with:
          name: prisma-debug-apk
          path: apk

      # O emulador precisa de acesso ao KVM (aceleração do processador).
      - name: Liberar o KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Para reduzir a foto da tela antes de imprimi-la no registro (prisma_tools emulador).
      - name: Instalar o ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Jogar no celular virtual
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: google_apis
          disable-animations: true
          script: tools/target/release/prisma_tools emulador apk resultado

      - name: Guardar o registro e a foto da tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulador-android-${{ matrix.api }}
          path: resultado
          if-no-files-found: ignore
