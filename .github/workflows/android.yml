name: Android

# Gera o APK a cada envio para a main, ou quando alguém clicar em "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Se chegar um envio novo enquanto o anterior ainda está gerando o APK, o antigo é cancelado.
concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    # Escrever na release exige permissão de escrita no repositório (só neste fluxo).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # A ferramenta que gera o APK carrega um Cargo antigo por dentro, que pode não ler o
      # formato novo do Cargo.lock (versão 4). Só neste fluxo, sem commitar, voltamos o
      # arquivo para a versão 3, que é igual para pacotes do crates.io.
      - name: Deixar o Cargo.lock no formato antigo
        run: sed -i 's/^version = 4$/version = 3/' Cargo.lock

      # Imagem oficial do tutorial do Macroquad: já traz Android SDK/NDK e o cargo-quad-apk.
      # Modo debug (assinado com uma chave de teste).
      # O comando roda de dentro de `game/` (-w): a ferramenta ignora `-p` e só enxerga o
      # pacote da pasta onde está; da raiz ela pegaria o motor e reclamaria que não acha o
      # miniquad. O APK sai em target/android-artifacts/debug/apk/ na raiz do projeto.
      # A imagem traz um Rust antigo (1.79, de 2024); o motor usa `Option::is_none_or`, que só
      # existe a partir do 1.82. Por isso o contêiner atualiza o Rust antes e instala de novo
      # os alvos do Android para a versão nova.
      - name: Gerar o APK
        run: |
          docker run --rm -v "$PWD":/root/src -w /root/src/game notfl3/cargo-apk sh -c '
            rustup update stable &&
            rustup default stable &&
            rustup target add armv7-linux-androideabi aarch64-linux-android i686-linux-android &&
            rustc --version &&
            cargo quad-apk build'

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: prisma-debug-apk
          path: target/android-artifacts/debug/apk/*.apk
          if-no-files-found: error

      # Release de endereço fixo, para baixar o .apk direto no celular, sem zip e sem login:
      # https://github.com/thiagodluz/prisma-rust/releases/download/apk-mais-recente/prisma-rust.apk
      # A cada execução a release antiga é apagada e uma nova é criada com o APK mais recente.
      - name: Publicar na release "apk-mais-recente"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(ls target/android-artifacts/debug/apk/*.apk | head -n 1)" prisma-rust.apk
          gh release delete apk-mais-recente --cleanup-tag --yes || true
          gh release create apk-mais-recente prisma-rust.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "APK mais recente (versão de teste)" \
            --notes "Gerado automaticamente a partir do commit ${GITHUB_SHA::7}. É uma versão de teste, assinada com uma chave de debug que muda a cada geração: desinstale a versão anterior antes de instalar esta."
